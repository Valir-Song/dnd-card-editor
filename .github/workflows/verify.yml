name: Verify editor
on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run check:build
      - name: Save standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: DND-Card-Editor-3.3-Moveable-Selecto
          path: dist/index.html
          retention-days: 30
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium firefox
      - name: Moveable + Selecto canvas browser test (Chromium)
        run: EDITOR_BROWSER=chromium python tests/canvas_browser_smoke.py
      - name: Moveable + Selecto canvas browser test (Firefox)
        run: EDITOR_BROWSER=firefox python tests/canvas_browser_smoke.py
      - name: Nested Moveable text frames (Chromium)
        run: EDITOR_BROWSER=chromium python tests/nested_browser_smoke.py
      - name: Nested Moveable text frames (Firefox)
        run: EDITOR_BROWSER=firefox python tests/nested_browser_smoke.py
      - name: Tiptap browser smoke (real built HTML, Chromium)
        run: EDITOR_BROWSER=chromium python tests/tiptap_browser_smoke.py
      - name: Tiptap browser smoke (real built HTML, Firefox)
        run: EDITOR_BROWSER=firefox python tests/tiptap_browser_smoke.py
